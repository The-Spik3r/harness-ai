# The upstream answers isError: returned as is.
tool_call:
  name: stub__slow
  arguments: '{"seconds":1}'
server: stub
category: outcome
expect: {dev: allow}
outcome: {dev: tool_error}
rule: tool.opaque
fault: tool_error
e2e: false
note: 'An upstream isError result is returned as is and recorded tool_error. A bad argument makes the stub answer isError before its tool body (and its counter) runs, so the runner fakes the upstream result (fault) and a real client cannot replay it.'
