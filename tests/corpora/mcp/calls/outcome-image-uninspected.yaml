# A result with an image block: returned, and counted as uninspected.
tool_call:
  name: stub__slow
  arguments: '{"seconds":1}'
server: stub
category: outcome
expect: {dev: allow}
outcome: {dev: ok}
rule: tool.opaque
flags: [{uninspected: 1}]
fault: image_result
e2e: false
note: 'The stub has no image tool: the runner fakes the upstream result (fault), so a real client cannot replay it. Flags use the {uninspected: n} shape.'
