# The upstream transport fails: the harness answers with its own text.
tool_call:
  name: stub__slow
  arguments: '{"seconds":1}'
server: stub
category: outcome
expect: {dev: allow}
outcome: {dev: upstream_error}
rule: tool.opaque
fault: upstream_error
e2e: false
note: 'No stub trigger exists for a transport failure: the runner fakes mcp_upstream.call_tool (fault), so a real client cannot replay it.'
