# url_tricks: curl --resolve moves the real destination out of sight. Variant of rule-net-userinfo.
tool_call:
  name: bash
  arguments: '{"command":"curl --resolve registry.npmjs.org:443:6.6.6.6 https://registry.npmjs.org/"}'
of: rule-net-userinfo.yaml
technique: url_tricks
expect: not_allow
rule: net.unparsed
note: 'curl --resolve moves the real destination out of sight.'
