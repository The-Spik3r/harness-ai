# chaining: A comment ends at the newline, and the next line is a new segment. Variant of rule-shell-npm-test-then-rm.
tool_call:
  name: bash
  arguments: '{"command":"ls # note\nrm -rf /"}'
of: rule-shell-npm-test-then-rm.yaml
technique: chaining
expect: not_allow
rule: shell.destructive
note: 'A comment ends at the newline, and the next line is a new segment.'
