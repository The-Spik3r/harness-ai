# path_tricks: a/.../b: a segment of only dots counts as outside the workspace (the paths.py fix). Variant of rule-fs-editor-escapes-workspace.
tool_call:
  name: write
  arguments: '{"filePath":"a/.../b","content":"A=1"}'
of: rule-fs-editor-escapes-workspace.yaml
technique: path_tricks
expect: not_allow
rule: fs.write_outside_workspace
note: 'a/.../b: a segment of only dots counts as outside the workspace (the paths.py fix).'
