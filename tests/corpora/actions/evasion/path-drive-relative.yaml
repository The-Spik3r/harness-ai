# path_tricks: C:x depends on a per-drive directory nobody here can see. Variant of rule-fs-editor-escapes-workspace.
tool_call:
  name: write
  arguments: '{"filePath":"C:x","content":"A=1"}'
of: rule-fs-editor-escapes-workspace.yaml
technique: path_tricks
expect: not_allow
rule: fs.write_outside_workspace
note: 'C:x depends on a per-drive directory nobody here can see.'
