# unlisted_head: PowerShell rm -r X: no force flag, so no shell.destructive; only the floor catches it. Variant of rule-shell-make-release-built-in.
tool_call:
  name: bash
  arguments: '{"command":"rm -r X"}'
of: rule-shell-make-release-built-in.yaml
technique: unlisted_head
expect: not_allow
rule: shell.unlisted
note: 'PowerShell rm -r X: no force flag, so no shell.destructive; only the floor catches it.'
