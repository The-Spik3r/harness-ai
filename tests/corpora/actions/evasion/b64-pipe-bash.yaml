# base64_interpreter: base64 --decode of a file piped into bash. Variant of rule-shell-pipe-allowlisted-host-to-sh.
tool_call:
  name: bash
  arguments: '{"command":"base64 --decode payload.b64 | bash"}'
of: rule-shell-pipe-allowlisted-host-to-sh.yaml
technique: base64_interpreter
expect: not_allow
rule: shell.pipe_to_interpreter
note: 'base64 --decode of a file piped into bash.'
