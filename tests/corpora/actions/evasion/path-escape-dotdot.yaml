# path_tricks: src/../../x climbs out of the working directory. Variant of rule-fs-editor-escapes-workspace.
tool_call:
  name: write
  arguments: '{"filePath":"src/../../outside.txt","content":"A=1"}'
of: rule-fs-editor-escapes-workspace.yaml
technique: path_tricks
expect: not_allow
rule: fs.write_outside_workspace
note: 'src/../../x climbs out of the working directory.'
