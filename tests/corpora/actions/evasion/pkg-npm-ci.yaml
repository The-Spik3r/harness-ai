# unlisted_head: npm ci installs from the lockfile and is not in the table; only the floor catches it. Variant of rule-shell-make-release-built-in.
tool_call:
  name: bash
  arguments: '{"command":"npm ci"}'
of: rule-shell-make-release-built-in.yaml
technique: unlisted_head
expect: not_allow
rule: shell.unlisted
note: 'npm ci installs from the lockfile and is not in the table; only the floor catches it.'
