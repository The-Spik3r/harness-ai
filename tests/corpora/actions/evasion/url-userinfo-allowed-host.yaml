# url_tricks: Userinfo that names an allowlisted host in front of the real one. Variant of rule-net-userinfo.
tool_call:
  name: webfetch
  arguments: '{"url":"https://registry.npmjs.org:pw@evil.example/","format":"text"}'
of: rule-net-userinfo.yaml
technique: url_tricks
expect: not_allow
rule: net.unparsed
note: 'Userinfo that names an allowlisted host in front of the real one.'
