# path_tricks: ~/../x stays under the home it names, outside the workspace. Variant of rule-fs-editor-escapes-workspace.
tool_call:
  name: write
  arguments: '{"filePath":"~/../x","content":"A=1"}'
of: rule-fs-editor-escapes-workspace.yaml
technique: path_tricks
expect: not_allow
rule: fs.write_outside_workspace
note: '~/../x stays under the home it names, outside the workspace.'
