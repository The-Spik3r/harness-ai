# unlisted_head: Invoke-Command runs a script block; only the floor catches it. Variant of rule-shell-make-release-built-in.
tool_call:
  name: bash
  arguments: '{"command":"Invoke-Command -ScriptBlock { Remove-Item -Recurse -Force C:\\ }"}'
of: rule-shell-make-release-built-in.yaml
technique: unlisted_head
expect: not_allow
rule: shell.unlisted
note: 'Invoke-Command runs a script block; only the floor catches it.'
