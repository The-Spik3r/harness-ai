# Ordinary work: list a directory. OpenCode `bash` (SOURCES.md: OpenCode v1.19.5; target `command`).
tool_call:
  name: bash
  arguments: '{"command":"ls -la"}'
policy: example
client: OpenCode
category: ordinary
expect: {user: allow, dba: allow, admin: allow}
rule: shell.allowlisted
note: 'ls is on the example shell allowlist.'
