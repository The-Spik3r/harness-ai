# shell.inline_interpreter: python -c. OpenCode `bash` (SOURCES.md: OpenCode v1.19.5; target `command`).
tool_call:
  name: bash
  arguments: '{"command":"python -c \"print(1)\""}'
policy: built_in
client: OpenCode
category: rule
expect: {user: deny, dba: deny, admin: deny}
rule: shell.inline_interpreter
note: 'An interpreter given inline code is shell.inline_interpreter, deny (Section 6.3).'
