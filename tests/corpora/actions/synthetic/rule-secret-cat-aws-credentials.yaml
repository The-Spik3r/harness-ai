# secret.read: a reader head on a secret file. OpenCode `bash` (SOURCES.md: OpenCode v1.19.5; target `command`).
tool_call:
  name: bash
  arguments: '{"command":"cat ~/.aws/credentials"}'
policy: built_in
client: OpenCode
category: rule
expect: {user: deny, dba: deny, admin: deny}
rule: secret.read
includes: [shell.unlisted]
note: 'cat is a reader head and ~/.aws/credentials matches the .aws/** secret glob (STORY-013).'
