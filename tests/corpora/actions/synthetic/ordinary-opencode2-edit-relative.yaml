# Ordinary work: edit a file by a relative path. OpenCode 2.x `edit` (SOURCES.md: OpenCode 2.0.10; target `path`).
tool_call:
  name: edit
  arguments: '{"path":"src/a.ts","oldString":"a","newString":"b","replaceAll":false}'
policy: built_in
client: OpenCode 2.x
category: ordinary
expect: {user: allow, dba: allow, admin: allow}
rule: fs.write_in_workspace
note: 'Same key rename as write: path, not filePath. The path stays below the working directory.'
