# secret.read: a file read of .env. OpenCode `read` (SOURCES.md: OpenCode v1.19.5; target `filePath`).
tool_call:
  name: read
  arguments: '{"filePath":".env"}'
policy: built_in
client: OpenCode
category: rule
expect: {user: deny, dba: deny, admin: deny}
rule: secret.read
note: 'Reading a file that matches the secret file globs is secret.read, not fs.read.'
