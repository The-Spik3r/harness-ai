# Ordinary work: write a file. Cline 3.x `write_to_file` (SOURCES.md: Cline v3.89.2; target `path`).
tool_call:
  name: write_to_file
  arguments: '{"path":"src/x.ts","content":"x"}'
policy: built_in
client: Cline 3.x
category: ordinary
expect: {user: allow, dba: allow, admin: allow}
rule: fs.write_in_workspace
note: 'A relative path below the working directory is inside the workspace.'
