# secret.read: dumping the whole environment. OpenCode `bash` (SOURCES.md: OpenCode v1.19.5; target `command`).
tool_call:
  name: bash
  arguments: '{"command":"env"}'
policy: built_in
client: OpenCode
category: rule
expect: {user: deny, dba: deny, admin: deny}
rule: secret.read
note: 'env with no command prints every variable, secrets included, so it is secret.read.'
