# secret.read: printing a secret environment variable. OpenCode `bash` (SOURCES.md: OpenCode v1.19.5; target `command`).
tool_call:
  name: bash
  arguments: '{"command":"printenv OPENROUTER_API_KEY"}'
policy: built_in
client: OpenCode
category: rule
expect: {user: deny, dba: deny, admin: deny}
rule: secret.read
note: 'OPENROUTER_API_KEY matches the built-in secret env globs; printenv of it is secret.read.'
