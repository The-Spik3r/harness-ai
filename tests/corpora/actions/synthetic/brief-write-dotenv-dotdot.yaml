# Brief criterion: config/../.env spelling of the protected write. OpenCode `write` (SOURCES.md: OpenCode v1.19.5; target `filePath`).
tool_call:
  name: write
  arguments: '{"filePath":"config/../.env","content":"A=1"}'
policy: built_in
client: OpenCode
category: brief
expect: {user: deny, dba: deny, admin: deny}
rule: fs.write_protected
note: 'PRD Section 11: the .. segment is resolved lexically, so config/../.env is .env and protected.'
