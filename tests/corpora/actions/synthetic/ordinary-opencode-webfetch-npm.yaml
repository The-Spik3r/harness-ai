# Ordinary work: fetch package metadata. OpenCode `webfetch` (SOURCES.md: OpenCode v1.19.5; target `url`).
tool_call:
  name: webfetch
  arguments: '{"url":"https://registry.npmjs.org/react","format":"text"}'
policy: example
client: OpenCode
category: ordinary
expect: {user: allow, dba: allow, admin: allow}
rule: net.allowlisted
note: 'registry.npmjs.org is an exact entry on the example network allowlist.'
