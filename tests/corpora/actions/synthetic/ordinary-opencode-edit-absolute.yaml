# Ordinary work: edit a file inside the workspace. OpenCode `edit` (SOURCES.md: OpenCode v1.19.5; target `filePath`).
tool_call:
  name: edit
  arguments: '{"filePath":"/home/dev/projects/app/README.md","oldString":"a","newString":"b"}'
policy: example
client: OpenCode
category: ordinary
expect: {user: allow, dba: allow, admin: allow}
rule: fs.write_in_workspace
note: 'The absolute path is under the example root /home/dev/projects.'
