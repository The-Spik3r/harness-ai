# Ordinary work: fetch a README. OpenCode `webfetch` (SOURCES.md: OpenCode v1.19.5; target `url`).
tool_call:
  name: webfetch
  arguments: '{"url":"https://raw.githubusercontent.com/o/r/main/README.md","format":"markdown"}'
policy: example
client: OpenCode
category: ordinary
expect: {user: allow, dba: allow, admin: allow}
rule: net.allowlisted
note: 'raw.githubusercontent.com matches the *.githubusercontent.com wildcard.'
